modLoader = "javafml"
loaderVersion = "[4,)"
[[mods]]
modId = "ae2androidcompat"
version = "1.0.0"
displayName = "AE2 Web Integration - Android Compat"
authors = "dspqle"
license = "MIT"
description = '''
Android/bionic compatibility layer for AE2 Web Integration.
Ships a bionic-built libsqlitejdbc.so and points org.sqlite.lib.path at it
before sqlite-jdbc initializes, so the native library loads on Android.
No JVM arguments required.
The original AE2 Web Integration jar is NOT modified in any way.
'''

[[dependencies.ae2androidcompat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ae2androidcompat]]
modId = "ae2webintegration"
type = "required"
versionRange = "[2.0.0,)"
ordering = "AFTER"
side = "BOTH"